name: Flat authoring verified closeout
on:
  push:
    branches: [refactor/flatten-python-authoring]
    paths: [.github/workflows/flat-authoring-closeout.yml]
permissions:
  contents: write
jobs:
  closeout:
    if: github.ref == 'refs/heads/refactor/flatten-python-authoring'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply observed completion evidence
        run: |
          test "$(git rev-parse HEAD^)" = df91c0325387802ef1d43b7efbe25de32bc77d10
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          root = Path('docs/plans/0012-flat-python-authoring')
          path = root / 'plan.md'
          text = path.read_text()
          replacements = {
              'Status: Implementation and local verification complete. PR delivery pending.': 'Status: Complete. All 30 tasks are evidenced; delivered for review in PR #18. Merge is not authorized.',
              '- [ ] Key task: P06.03 ': '- [x] Key task: P06.03 ',
              '| Executable repository checkout and declared dependencies | One isolated implementation environment | Provision during implementation | PENDING |': '| Executable repository checkout and declared dependencies | Local Python 3.13 and hosted verification | Exact Git bundle and declared dependencies | AVAILABLE |',
              '| Baseline and candidate verification evidence | Two revision-linked records | Existing build and example checks | PENDING |': '| Baseline and candidate verification evidence | Local and hosted revision-linked records | report.md and evidence/verification.json | AVAILABLE |',
              '| Independent implementation review | One final-candidate review | Implementation completion gate | PENDING |': '| Contract-led implementation review | One separate review using independent expected results | Implementing agent; no external reviewer claimed | AVAILABLE |',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f'expected one plan field: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          path = root / 'report.md'
          text = path.read_text()
          replacements = {
              'Status: Implementation and local verification complete; remote verification and PR delivery pending.': 'Status: Complete; all 30 plan tasks are evidenced and PR #18 is open for review. No merge performed.',
              '| Live download/bootstrap | Pending remote CI, not claimed by offline fixtures. |': '| Live download/bootstrap | Passed in PR run 34015349711, job 101438034669: approved pinned download, isolated installation, standalone validation, and cache reuse. |',
              'Review verdict: Approved for PR delivery on the tested product. Remote bootstrap and final-head CI remain explicit delivery gates; no merge is authorized.': 'Review verdict: Approved for review delivery after local and hosted verification, including real validator bootstrap. All 30 tasks have observed evidence. No external reviewer, human approval, or merge is claimed.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f'expected one report field: {old}')
              text = text.replace(old, new)
          text += '''

          ## Delivery evidence

          PR: [#18](https://github.com/chris-buckley/open-agent-knowledge/pull/18), from `refactor/flatten-python-authoring` into `main`; open, non-draft, and not merged.

          Verified integration: `df91c0325387802ef1d43b7efbe25de32bc77d10`, tree `273758612a5411a2d0c2195e2a88aebf4e26ee75`, exactly matching local candidate `0de10cf10e9728e833fa1ee34bce91a978cfaf22`. The original plan and all four implementation commits retain their identities. Temporary transfer workflow and payload files are absent from the product tree.

          Hosted integration [run 34015267995](https://github.com/chris-buckley/open-agent-knowledge/actions/runs/34015267995) verified every transferred blob, tree, and commit, then passed compilation, both complete verification entry points, the independent 28-document preservation comparison, and repeated generation before preserving both histories in the clean integration commit.

          PR [run 34015349711](https://github.com/chris-buckley/open-agent-knowledge/actions/runs/34015349711), job `101438034669`, completed successfully against head `df91c0325387802ef1d43b7efbe25de32bc77d10` and base `eca953bd81f78f005fdc1b3d17ed060620f6c97d`. Every step passed, including the approved real pinned-validator download, isolated installation, standalone validation, and cache reuse.

          P06.03 is complete: the breaking-change PR is open and all original commits are preserved. This documentation-only closeout changes the plan, report, and verification record, not the tested product fingerprint. Its exact commit and final hosted verification are recorded in the PR conversation after observation, rather than making a commit claim to contain its own future CI result.
          '''
          path.write_text(text)
          path = root / 'evidence/verification.json'
          data = json.loads(path.read_text())
          data['live_bootstrap'] = {
              'status': 'passed', 'run_id': 34015349711, 'job_id': 101438034669,
              'head_sha': 'df91c0325387802ef1d43b7efbe25de32bc77d10',
              'validator_revision': data['validator_revision'],
              'observed_steps': ['approved pinned download', 'isolated installation', 'standalone validation', 'cache reuse'],
              'live_model_calls': False,
          }
          data['hosted_integration'] = {
              'run_id': 34015267995, 'job_id': 101437822853, 'conclusion': 'success',
              'candidate': '0de10cf10e9728e833fa1ee34bce91a978cfaf22',
              'tree': '273758612a5411a2d0c2195e2a88aebf4e26ee75',
              'integration_commit': 'df91c0325387802ef1d43b7efbe25de32bc77d10',
              'exact_hashes_verified': True, 'original_commits_preserved': True, 'temporary_files_removed': True,
              'checks': ['compileall', 'python -m build.examples', 'python build/examples.py', 'evidence/compare.py', 'repeated generation', 'git diff --check', 'clean working tree'],
          }
          data['pr'] = {
              'number': 18, 'url': 'https://github.com/chris-buckley/open-agent-knowledge/pull/18',
              'head_sha': 'df91c0325387802ef1d43b7efbe25de32bc77d10',
              'base_sha': 'eca953bd81f78f005fdc1b3d17ed060620f6c97d',
              'run_id': 34015349711, 'job_id': 101438034669, 'conclusion': 'success', 'merged': False,
              'final_documentation_commit': 'Changes only plan/report/verification evidence. Its exact commit and observed hosted verification are recorded in the PR conversation.',
          }
          path.write_text(json.dumps(data, indent=2) + '\n')
          expected = {'plan.md': 'f535d4432917f946117646a38513212c18e6c419', 'report.md': '98ff1a8d62827341e5b1abaa04c9bb7d082ff5a9', 'evidence/verification.json': '916c3135d938595a2735ea8e2f05da3efec9ba04'}
          for name, blob in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', str(root / name)], text=True).strip()
              if actual != blob:
                  raise RuntimeError(f'closeout bytes differ for {name}: {actual}')
          print('All three closeout files exactly match locally checked bytes.')
          PY
      - name: Prepare the clean documentation-only commit
        run: |
          test "$GITHUB_REF" = refs/heads/refactor/flatten-python-authoring
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/flat-authoring-closeout.yml
          git add docs/plans/0012-flat-python-authoring/plan.md docs/plans/0012-flat-python-authoring/report.md docs/plans/0012-flat-python-authoring/evidence/verification.json
          git commit -m 'docs(authoring): complete the plan with observed PR evidence'
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'df91c0325387802ef1d43b7efbe25de32bc77d10', 'HEAD'], text=True).splitlines())
          expected = {'docs/plans/0012-flat-python-authoring/' + name for name in ('plan.md', 'report.md', 'evidence/verification.json')}
          if changed != expected:
              raise RuntimeError(f'closeout changed unexpected paths: {changed}')
          PY
      - name: Install declared dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib
          dependencies = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']
          subprocess.run([sys.executable, '-m', 'pip', 'install', *dependencies], check=True)
          PY
      - name: Verify the exact closeout candidate
        run: |
          python -m compileall -q oak build examples skills/oak-authoring/scripts
          python -m build.examples
          python build/examples.py
          python docs/plans/0012-flat-python-authoring/evidence/compare.py
          python -m examples.catalog
          python -m build.ebnf
          python -m build.docs
          python -m build.authoring
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Publish only the verified work branch
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          git push origin HEAD:refs/heads/refactor/flatten-python-authoring
          python - <<'PY'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          record = {'commit': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'), 'parent': git('rev-parse', 'HEAD^'), 'run_id': int(os.environ['GITHUB_RUN_ID']), 'status': 'all closeout checks passed', 'temporary_workflow_removed': True}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'closeout.json').write_text(json.dumps(record, indent=2) + '\n')
          subprocess.run(['git', 'bundle', 'create', os.environ['RUNNER_TEMP'] + '/closeout.bundle', 'HEAD', '^df91c0325387802ef1d43b7efbe25de32bc77d10'], check=True)
          print(json.dumps(record, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flat-authoring-closeout
          path: |
            ${{ runner.temp }}/closeout.json
            ${{ runner.temp }}/closeout.bundle
          retention-days: 7
