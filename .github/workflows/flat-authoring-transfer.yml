name: Flat authoring verified integration
on:
  push:
    branches: [refactor/flatten-python-authoring]
    paths: [.github/workflows/flat-authoring-transfer.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/refactor/flatten-python-authoring'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact source commits and tree
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma, os, subprocess, tempfile
          BASE = '41308c59cf483903c5f856c6d52aa6d786829e94'
          COMMITS = ['dc71e5ec140e1b94351ceabab3a55b9ab8aa9dce', '6be73d22fc1e97c3616502c57949ed798d4abfb6', '0dd04064a0e9878e7ce4a5c26b9f650ef454a21b', '0de10cf10e9728e833fa1ee34bce91a978cfaf22']
          TREE = '273758612a5411a2d0c2195e2a88aebf4e26ee75'
          PAYLOAD = '619f992eacd29211b23b9cc73beb984e247f1db2399c519f9a059cbaf89f63d8'
          def git(*args, data=None, env=None):
              return subprocess.check_output(['git', *args], input=data, env=env).decode('utf-8').rstrip('\n')
          original = git('rev-parse', 'HEAD')
          if os.environ.get('GITHUB_SHA') != original:
              raise RuntimeError('checkout differs from the workflow revision')
          allowed = {'.github/workflows/flat-authoring-transfer.yml'} | {f'.github/flat-authoring-transfer/{i}.b64' for i in range(5)}
          changed = set(git('diff', '--name-only', BASE, original).splitlines())
          if not changed <= allowed:
              raise RuntimeError(f'unexpected concurrent branch changes: {changed - allowed}')
          encoded = ''.join(Path(f'.github/flat-authoring-transfer/{i}.b64').read_text() for i in range(5))
          compressed = base64.b64decode(''.join(encoded.split()), validate=True)
          if hashlib.sha256(compressed).hexdigest() != PAYLOAD:
              raise RuntimeError('transfer payload does not match reviewed bytes')
          payload = json.loads(lzma.decompress(compressed))
          if payload['base'] != BASE or [item['sha'] for item in payload['commits']] != COMMITS:
              raise RuntimeError('unexpected history in transfer')
          parent = BASE
          with tempfile.TemporaryDirectory(prefix='oak-transfer-index-') as temporary:
              env = {**os.environ, 'GIT_INDEX_FILE': str(Path(temporary) / 'index')}
              for record in payload['commits']:
                  git('read-tree', parent, env=env)
                  for entry in record['entries']:
                      path = PurePosixPath(entry['path'])
                      if path.is_absolute() or '..' in path.parts or '.git' in path.parts or path.as_posix() != entry['path']:
                          raise RuntimeError(f'unsafe path: {path}')
                      if entry.get('delete'):
                          git('update-index', '--force-remove', '--', str(path), env=env)
                          continue
                      if entry['mode'] not in {'100644', '100755'}:
                          raise RuntimeError('unexpected file mode')
                      text = subprocess.check_output(['git', 'cat-file', 'blob', entry['source']]).decode('utf-8') if entry['source'] else ''
                      for start, stop, replacement in reversed(entry['edits']):
                          if not 0 <= start <= stop <= len(text):
                              raise RuntimeError('invalid text edit')
                          text = text[:start] + replacement + text[stop:]
                      blob = git('hash-object', '-w', '--stdin', data=text.encode('utf-8'))
                      if blob != entry['sha']:
                          raise RuntimeError(f'blob mismatch: {path}')
                      git('update-index', '--add', '--cacheinfo', entry['mode'], blob, str(path), env=env)
                  tree = git('write-tree', env=env)
                  headers = record['commit'].split('\n\n', 1)[0].splitlines()
                  if headers[0] != f'tree {tree}' or [line for line in headers if line.startswith('parent ')] != [f'parent {parent}']:
                      raise RuntimeError('tree or parent mismatch')
                  commit = git('hash-object', '-t', 'commit', '-w', '--stdin', data=record['commit'].encode('utf-8'))
                  if commit != record['sha']:
                      raise RuntimeError('commit identity mismatch')
                  print('Verified original commit', commit, 'tree', tree, flush=True)
                  parent = commit
          if git('rev-parse', f'{parent}^{{tree}}') != TREE:
              raise RuntimeError('final reviewed tree differs')
          subprocess.run(['git', 'checkout', '--detach', parent], check=True)
          record_path = Path(os.environ['RUNNER_TEMP']) / 'oak-delivery.json'
          record_path.write_text(json.dumps({'transfer_parent': original, 'candidate': parent, 'tree': TREE, 'base': BASE, 'commits': COMMITS}, indent=2) + '\n')
          PY
      - name: Install declared dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib
          dependencies = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']
          subprocess.run([sys.executable, '-m', 'pip', 'install', *dependencies], check=True)
          PY
      - name: Verify the actual candidate
        run: |
          python -m compileall -q oak build examples skills/oak-authoring/scripts
          python -m examples.catalog
          python -m build.ebnf
          python -m build.docs
          python -m build.authoring
          python -m build.examples
          python build/examples.py
          python docs/plans/0012-flat-python-authoring/evidence/compare.py
          python -m examples.catalog
          python -m build.ebnf
          python -m build.docs
          python -m build.authoring
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Preserve both histories in the clean integration tree
        run: |
          test "$GITHUB_REF" = refs/heads/refactor/flatten-python-authoring
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json, os, pathlib, subprocess
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'oak-delivery.json'
          record = json.loads(path.read_text())
          if subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip() != record['tree']:
              raise RuntimeError('verified tree changed')
          message = 'refactor(authoring): integrate verified statement migration\n\nPreserve every original implementation and transfer commit. The final tree exactly matches the locally reviewed candidate and contains no transfer files.\n'
          merged = subprocess.check_output(['git', 'commit-tree', record['tree'], '-p', record['transfer_parent'], '-p', record['candidate']], input=message, text=True).strip()
          subprocess.run(['git', 'merge-base', '--is-ancestor', record['transfer_parent'], merged], check=True)
          subprocess.run(['git', 'merge-base', '--is-ancestor', record['candidate'], merged], check=True)
          subprocess.run(['git', 'push', 'origin', merged + ':refs/heads/refactor/flatten-python-authoring'], check=True)
          record['integration_commit'] = merged
          record['hosted_verification'] = 'passed both complete entry points, exact preservation comparisons, compilation, and repeated generation'
          path.write_text(json.dumps(record, indent=2) + '\n')
          subprocess.run(['git', 'update-ref', 'refs/heads/verified-delivery', merged], check=True)
          subprocess.run(['git', 'bundle', 'create', os.environ['RUNNER_TEMP'] + '/oak-delivery.bundle', 'refs/heads/verified-delivery', '^' + record['base']], check=True)
          print(json.dumps(record, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flat-authoring-delivery
          path: |
            ${{ runner.temp }}/oak-delivery.json
            ${{ runner.temp }}/oak-delivery.bundle
          retention-days: 7
