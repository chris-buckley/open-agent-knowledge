name: Verify and preserve generated dialogue
on:
  push:
    branches: [experiment/agent-guided-network]
    paths:
      - experiments/agent-guided-network/dialogue/**
      - experiments/agent-guided-network/results/dialogue-run/expected.json
      - .github/workflows/dialogue-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dialogue-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evidence:
    if: github.ref == 'refs/heads/experiment/agent-guided-network'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared repository and fixed numerical dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib
          deps = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']
          subprocess.run([sys.executable, '-m', 'pip', 'install', *deps, 'numpy==2.3.5'], check=True)
          PY
      - name: Verify branch and all six experiment suites
        run: |
          python -m compileall -q oak build examples experiments/agent-guided-network
          python -m examples.catalog
          python -m build.ebnf
          python -m build.docs
          python -m build.authoring
          python -m build.examples
          python build/examples.py
          git diff --exit-code
          python experiments/agent-guided-network/run.py test
          python experiments/agent-guided-network/attention/run.py test
          python experiments/agent-guided-network/compression/run.py test
          python experiments/agent-guided-network/meaning/run.py test
          python experiments/agent-guided-network/modularity/tests.py
          python experiments/agent-guided-network/dialogue/tests.py
      - name: Reproduce recorded teaching and verify paired execution
        run: python experiments/agent-guided-network/dialogue/reproduce.py /tmp/oak-dialogue-replay
      - name: Preserve audited records and update learning index
        run: |
          python experiments/agent-guided-network/dialogue/publication.py /tmp/oak-dialogue-replay
          python -m build.examples
          python build/examples.py
          git diff --check
      - name: Commit evidence only to the unchanged experiment branch
        run: |
          expected='${{ github.sha }}'
          actual=$(git ls-remote origin refs/heads/experiment/agent-guided-network | cut -f1)
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/agent-guided-network/results/dialogue-run experiments/agent-guided-network/nodes/dialogue-learned experiments/agent-guided-network/LEARNINGS.md experiments/agent-guided-network/EXPERIMENT.md docs/plans/0011-agent-guided-network/plan.md
          git commit -m 'test(dialogue): preserve matched generation evidence and learning records'
          git push origin HEAD:refs/heads/experiment/agent-guided-network
      - name: Package published source
        run: |
          mkdir -p /tmp/dialogue-artifact
          git rev-parse HEAD > /tmp/dialogue-artifact/REVISION
          git archive HEAD -o /tmp/dialogue-artifact/source.tar
          cd /tmp/dialogue-artifact
          sha256sum source.tar REVISION > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: oak-dialogue-verified-source
          path: /tmp/dialogue-artifact/
          retention-days: 7
          if-no-files-found: error
