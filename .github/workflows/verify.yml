name: Verify OAK
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install repository dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib
          dependencies = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']
          subprocess.run([sys.executable, '-m', 'pip', 'install', *dependencies], check=True)
          PY
      - name: Verify all products and repeat generation
        run: |
          python -m compileall -q oak build examples skills/oak-authoring/scripts
          python -m examples.catalog
          python -m build.ebnf
          python -m build.docs
          python -m build.authoring
          python -m build.examples
          python build/examples.py
          python -m build.authoring
          git diff --exit-code
      - name: Verify approved detached bootstrap and cache reuse
        run: python -m build.checks.bootstrap_integration --allow-download
