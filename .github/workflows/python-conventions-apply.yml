name: Apply reviewed Python conventions
on:
  push:
    branches: [improve/python-code-conventions]
    paths: [.github/workflows/python-conventions-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install temporary migration dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys, tomllib
          dependencies = tomllib.loads(Path('pyproject.toml').read_text())['project']['dependencies']
          subprocess.run([sys.executable, '-m', 'pip', 'install', *dependencies, 'mistune==3.2.1'], check=True)
          PY
      - name: Reconstruct and verify the reviewed product tree
        run: |
          python - <<'PY'
          import base64, gzip, json, os, subprocess, sys
          from pathlib import Path, PurePosixPath
          from tempfile import TemporaryDirectory
          payload = ''.join(Path(f'.github/conventions-transport/part-{index}.txt').read_text() for index in range(4))
          recipe = json.loads(gzip.decompress(base64.b64decode(payload, validate=True)))
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          if parent != recipe['parent_commit']:
              raise SystemExit('branch moved before reviewed transport; refusing to apply')
          with TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as temporary:
              for name in ('migration', 'integration'):
                  script = Path(temporary) / f'{name}.py'
                  script.write_text(recipe[name], encoding='utf-8')
                  subprocess.run([sys.executable, str(script)], check=True)
          for name, text in recipe['writes'].items():
              path = PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts or name != path.as_posix():
                  raise SystemExit('unsafe candidate path')
              destination = Path(name)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(text, encoding='utf-8')
          subprocess.run(['git', 'add', '-A'], check=True)
          transport = [
              '.github/workflows/python-conventions-snapshot.yml',
              '.github/workflows/python-conventions-apply.yml',
              *[f'.github/conventions-transport/part-{index}.txt' for index in range(4)],
          ]
          subprocess.run(['git', 'rm', '--cached', '--', *transport], check=True)
          product = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          if product != recipe['expected_product_tree']:
              raise SystemExit(f'candidate tree differs: {product}')
          print(f'PASS: exact reviewed product tree {product}')
          subprocess.run(['git', 'add', '--', *transport], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          from build.checks.agents import validate_agents
          from build.checks.plans import validate_plans
          from build.checks.coding_standards import validate_coding_standards
          for check in (validate_agents, validate_plans, validate_coding_standards):
              check()
          PY
      - name: Commit the candidate without changing transport files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: migrate canonical Python conventions to modular OAK knowledge'
          git push origin HEAD:refs/heads/improve/python-code-conventions
