name: Close generated product plan
on:
  push:
    branches: [docs/plan-generated-products]
    paths: [.github/workflows/generated-products-closeout.yml]
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record observed completion
        run: |
          test "$(git rev-parse HEAD^)" = 46d141ed5d3052cee77c2b119d70d8b7b4113fb8
          python - <<'PY'
          from pathlib import Path
          root = Path.cwd()
          plan = root / 'docs/plans/0014-generated-products/plan.md'
          report = plan.with_name('report.md')
          text = plan.read_text(encoding='utf-8')
          assert text.count('- [ ] Key task:') == 2
          text = text.replace('Plan status: Executing approved delivery.', 'Plan status: Complete.')
          text = text.replace('Implementation status: Locally verified; remote candidate and PR delivery pending.', 'Implementation status: Complete; delivered in PR #22 with passing implementation CI. Not merged.')
          for task in ('P06.02', 'P06.03'):
              text = text.replace(f'- [ ] Key task: {task} ', f'- [x] Key task: {task} ')
          text = text.replace('Transportation: Deliver the grammar, reference, standalone agent, and skill', 'Transportation: Deliver the grammar, definitions, standalone agent, and skill')
          assert '- [ ] Key task:' not in text
          assert text.count('- [x] Key task:') == 24
          plan.write_text(text, encoding='utf-8', newline='\n')
          text = report.read_text(encoding='utf-8')
          text = text.replace('Status: Implementation verified locally; remote delivery and pull request pending.', 'Status: Complete. Delivered in PR #22; implementation CI passed. Not merged.')
          before = 'Pending remote candidate verification and pull request creation.'
          assert text.count(before) == 1
          text = text.replace(before, '''Implementation commit: `46d141ed5d3052cee77c2b119d70d8b7b4113fb8`.
          Verified implementation tree: `8759292b5c0e52fbe094c6c94a0366bd7e9a4f92`.
          Pull request: [#22 into main](https://github.com/chris-buckley/open-agent-knowledge/pull/22).

          The [corrected candidate run 34034557254](https://github.com/chris-buckley/open-agent-knowledge/actions/runs/34034557254) passed both complete verification entry points, the frozen-baseline audit, repeated generation, and exact Git-tree checks. Its final push was rejected because the Actions token could not update `verify.yml`. The repository connector then fast-forwarded the work branch to the same verified commit, preserving its identity and every original ancestor. No verification failure is concealed by that transport recovery.

          The normal [Verify OAK run 34034731684](https://github.com/chris-buckley/open-agent-knowledge/actions/runs/34034731684) passed for the implementation in PR #22. This includes compilation, both complete entry points, fresh generation without a diff, and the approved detached validator bootstrap: refusal without consent, pinned download and isolated installation with consent, and retained cache reuse without the permission flag.

          All 24 plan tasks are checked, and E01 through E05 are supported by the recorded evidence. The closeout changes only the plan and this report; product and implementation bytes remain those of the verified tree. Temporary transport files and workflows are absent from the delivered product change. Final verification verdict: Approved. This verdict does not authorise merging; that remains a separate repository-owner decision.''')
          report.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Verify document-only final tree
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib
          dependencies = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']
          subprocess.run([sys.executable, '-m', 'pip', 'install', *dependencies], check=True)
          PY
          python -c 'from build.checks.plans import validate_plans; validate_plans()'
          python docs/plans/0014-generated-products/evidence/audit.py
          rm .github/workflows/generated-products-closeout.yml
          git add -A
          test "$(git write-tree)" = 712e996b3fe9ef0f6b121cedc92bdd76dc3781f8
          git restore --staged --worktree --source=HEAD -- .github/workflows/generated-products-closeout.yml
          git diff --cached --check
      - name: Commit documentation only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(plans): complete generated product verification'
          git fetch origin docs/plan-generated-products
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:refs/heads/docs/plan-generated-products
          echo "Completion commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
