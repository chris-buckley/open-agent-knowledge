name: EBNF verified transfer
on:
  push:
    branches: [docs/plan-ebnf-layout]
    paths: [.github/workflows/ebnf-work.yml]
permissions:
  contents: write
jobs:
  transfer:
    if: github.ref == 'refs/heads/docs/plan-ebnf-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore the exact locally verified tree
        run: |
          test "$GITHUB_REF" = refs/heads/docs/plan-ebnf-layout
          test "$(git rev-parse HEAD^)" = cd648d224510a902acac46c85753ec6e97854195
          mkdir -p "$RUNNER_TEMP/ebnf-candidate"
          python - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          changed = set(subprocess.check_output(['git', 'diff', 'HEAD^', 'HEAD', '--name-only'], text=True).splitlines())
          allowed = {'.github/workflows/ebnf-work.yml', *(f'.github/ebnf-transfer/{i:02}.b64' for i in range(7))}
          assert changed == allowed, changed
          encoded = ''.join(pathlib.Path(f'.github/ebnf-transfer/{i:02}.b64').read_text() for i in range(7))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'e61fe85cbb05bd074d599ec27be6b04372a06b747da321eb0a54f1ae3778f1ca'
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '7a801d23ca286bf42ed272f44c44bfada653047c5384bf15ce4b9332eeac83a6'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ebnf.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'rm', '-r', '.github/ebnf-transfer', '.github/workflows/ebnf-work.yml'], check=True)
          subprocess.run(['git', 'apply', '--index', str(target)], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == 'aae26bb59ff404c0ea471685577d8abb2d2c4bd5', tree
          print('Restored exact verified tree:', tree)
          PY
      - name: Install declared repository dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib
          dependencies = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']
          subprocess.run([sys.executable, '-m', 'pip', 'install', *dependencies], check=True)
          PY
      - name: Verify the candidate with declared dependencies
        run: |
          set -o pipefail
          {
            python --version
            python -m pip freeze
            python -m compileall -q oak build examples skills/oak-authoring/scripts
            python -m examples.catalog
            python -m build.ebnf
            python -m build.docs
            python -m build.authoring
            python -c 'from build.checks.ebnf import validate_ebnf; validate_ebnf()'
            python docs/plans/0013-ebnf-layout/evidence/compare.py
            python -m build.examples
            python build/examples.py
            python -m build.authoring
            git diff --exit-code
            git diff --cached --check
            test "$(git write-tree)" = aae26bb59ff404c0ea471685577d8abb2d2c4bd5
          } 2>&1 | tee "$RUNNER_TEMP/ebnf-candidate/verification.log"
      - name: Publish the verified branch without transport files
        run: |
          test "$GITHUB_REF" = refs/heads/docs/plan-ebnf-layout
          test "$(git ls-remote origin refs/heads/docs/plan-ebnf-layout | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(ebnf): organise generated grammar reference'
          test "$(git rev-parse HEAD^{tree})" = aae26bb59ff404c0ea471685577d8abb2d2c4bd5
          git push origin HEAD:refs/heads/docs/plan-ebnf-layout
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/ebnf-candidate/revisions.txt"
          git bundle create "$RUNNER_TEMP/ebnf-candidate/oak.bundle" HEAD refs/remotes/origin/main
          sha256sum "$RUNNER_TEMP/ebnf-candidate/oak.bundle"
      - name: Publish actual verification and checkout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebnf-candidate
          path: ${{ runner.temp }}/ebnf-candidate
          retention-days: 7
