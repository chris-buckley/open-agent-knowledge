name: OAK context verification
on:
  push:
    branches: [feat/oak-native-interpreter-context]
permissions:
  contents: write
  statuses: write
concurrency:
  group: oak-context-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply the exact reviewed patch
        id: apply
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          import subprocess
          from pathlib import Path
          transport = Path('.agents/context-change.patch.gz.base64')
          if not transport.exists():
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('applied=false\n')
              raise SystemExit(0)
          expected = 'a4d70be1026d549f44d050d428d478dee5dc6c42009e8af972512a8c6d7633a8'
          patch = gzip.decompress(base64.b64decode(''.join(transport.read_text().split()), validate=True))
          if hashlib.sha256(patch).hexdigest() != expected:
              raise RuntimeError('reviewed patch digest does not match')
          path = Path('/tmp/oak-context.patch')
          path.write_bytes(patch)
          changes = subprocess.check_output(['git', 'apply', '--numstat', str(path)], text=True).splitlines()
          if len(changes) != 24 or any(not line.split('\t', 2)[2].startswith(('oak/', 'build/', 'examples/', 'docs/plans/')) for line in changes):
              raise RuntimeError('reviewed patch changes unexpected paths')
          subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          subprocess.run(['git', 'rm', str(transport), '.github/workflows/oak-context-verification.yml'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('applied=true\n')
          PY
      - name: Install declared repository dependencies
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          dependencies = tomllib.loads(Path('pyproject.toml').read_text())['project']['dependencies']
          subprocess.run([sys.executable, '-m', 'pip', 'install', *dependencies], check=True)
          PY
      - name: Verify compilation and both repository entry points
        run: |
          python -m compileall -q oak build examples
          python -m build.examples
          python build/examples.py
          git diff --check
          git diff --cached --check
      - name: Verify repeated generation leaves the reviewed bytes unchanged
        if: steps.apply.outputs.applied == 'true'
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from examples.agents import implementer, interpreter_context
          from examples.schemas import verification
          for _ in range(2):
              for module in ('build.ebnf', 'build.docs', 'build.authoring'):
                  subprocess.run([sys.executable, '-m', module], check=True)
              for example in (implementer, interpreter_context, verification):
                  example.write()
              subprocess.run(['git', 'diff', '--exit-code'], check=True)
          PY
      - name: Record the completed verification and verify the final tree
        if: steps.apply.outputs.applied == 'true'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          plan = Path('docs/plans/0004-plan.md')
          text = plan.read_text()
          pending = '* [ ] Verify the final implementation tree on GitHub.'
          if text.count(pending) != 1:
              raise RuntimeError('expected one pending verification check')
          plan.write_text(text.replace(pending, '* [x] Verify the final implementation tree on GitHub.'))
          report = Path('docs/plans/0004-report.md')
          text = report.read_text()
          pending = 'GitHub verification: pending.'
          if text.count(pending) != 1:
              raise RuntimeError('expected one pending verification record')
          url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          report.write_text(text.replace(pending, f'GitHub verification: compilation, both repository entry points, and repeated-generation freshness passed in [run {os.environ["GITHUB_RUN_ID"]}]({url}).'))
          PY
          python -m compileall -q oak build examples
          python -m build.examples
          python build/examples.py
          git diff --check
      - name: Publish the verified implementation on the feature branch only
        if: steps.apply.outputs.applied == 'true'
        run: |
          test "$GITHUB_REF_NAME" = 'feat/oak-native-interpreter-context'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(oak): add native interpreter context and revision-linked evidence'
          git push origin HEAD:refs/heads/feat/oak-native-interpreter-context
      - name: Attach verification status to the actual published commit
        if: steps.apply.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from urllib.request import Request, urlopen
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          repo = os.environ['GITHUB_REPOSITORY']
          run = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          payload = {'state': 'success', 'context': 'OAK verification', 'description': 'Compilation, 18 registered checks, both entry points, and repeated generation passed.', 'target_url': run}
          request = Request(f"{os.environ['GITHUB_API_URL']}/repos/{repo}/statuses/{sha}", data=json.dumps(payload).encode(), headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
          with urlopen(request) as response:
              if response.status != 201:
                  raise RuntimeError(f'failed to publish verification status: {response.status}')
          print(f'Published verification status for {sha}')
          PY
      - name: Preserve exact source for independent comparison
        if: always()
        run: |
          git archive --format=tar HEAD > /tmp/oak-source.tar
          git rev-parse HEAD > /tmp/oak-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oak-verified-${{ github.run_id }}
          path: |
            /tmp/oak-source.tar
            /tmp/oak-commit.txt
