name: Generated product migration workspace
on:
  push:
    branches: [docs/plan-generated-products]
    paths:
      - .github/workflows/generated-products-work.yml
permissions:
  contents: write
concurrency:
  group: generated-product-migration
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'chris-buckley/open-agent-knowledge' && github.ref == 'refs/heads/docs/plan-generated-products'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared verification dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib
          dependencies = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']
          subprocess.run([sys.executable, '-m', 'pip', 'install', *dependencies], check=True)
          PY
      - name: Apply the hash-verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2c9276dd4a650d7017f82d1a80da1d9b6ae26516 HEAD
          git diff --exit-code 2c9276dd4a650d7017f82d1a80da1d9b6ae26516 HEAD -- . ':! .github/unused' ':(exclude).github/generated-products-source.patch.b64' ':(exclude).github/workflows/generated-products-work.yml'
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, shutil, subprocess, tempfile
          root = pathlib.Path.cwd()
          encoded = ''.join((root / '.github/generated-products-source.patch.b64').read_text().split())
          # Correct the three observed transport transcription differences, then require the original payload digest.
          repairs = [
              ('Xw24yHvTDnj8eDkdxHPrhOBpE', 'Xw24yHvTDnj8ZDkdxHPrhOBpE'),
              ('9cZ0zgVQniWiShiWhgThjM4UALm', '9cZ0zgVQniWiWhgThjM4UALm'),
              ('dpUwjRV+v16v6PCQ3ZvsGU2X', 'dpUwjRV+v16v86PCQ3ZvsGU2X'),
          ]
          for before, after in repairs:
              if encoded.count(before) != 1:
                  raise RuntimeError('unexpected transfer payload; refusing to apply')
              encoded = encoded.replace(before, after)
          payload = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(payload).hexdigest() != 'ca46634f41f8011da4f6420eac83db7b18e22636ccd679bc006793a6c17f3834':
              raise RuntimeError('candidate patch integrity mismatch')
          evidence = root / 'docs/plans/0014-generated-products/evidence'
          evidence.mkdir(exist_ok=True)
          manifest = {}
          for folder in ('outputs', 'skills'):
              for path in sorted((root / folder).rglob('*')):
                  if not path.is_file() or '__pycache__' in path.parts:
                      continue
                  old = path.relative_to(root).as_posix()
                  if old.endswith('/AGENTS.md'):
                      destination, kind = 'build/AGENTS.md', 'consolidated guidance'
                  elif old == 'skills/oak-authoring/scripts/validate.py':
                      destination, kind = 'build/authoring_validator.py', 'maintained source plus generated copy'
                  elif old.startswith('outputs/docs/'):
                      destination, kind = 'generated/definitions/' + path.stem + '.oak.md', 'definition path constant'
                  else:
                      destination = old.replace('outputs/', 'generated/', 1).replace('skills/oak-authoring/', 'generated/oak-authoring.skill/', 1)
                      kind = 'identical bytes'
                  manifest[old] = {'destination': destination, 'change': kind, 'bytes': path.stat().st_size,
                                   'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
          (evidence / 'baseline-products.json').write_text(json.dumps({
              'baseline': '2a3ba6c27b6110de4ace334e51d2f195a7ded522',
              'planning_tip': 'df5b1af4b610c7d2f804ea4079962a7bb1f64115',
              'workspace_tree': '54cfe6a921e7d162fcb87d8ee5b8335874a644d2',
              'products': manifest}, indent=2) + '\n')
          shutil.copyfile(root / 'skills/oak-authoring/scripts/validate.py', root / 'build/authoring_validator.py')
          with tempfile.NamedTemporaryFile(suffix='.patch') as patch:
              patch.write(payload)
              patch.flush()
              subprocess.run(['git', 'apply', '--unidiff-zero', '--check', patch.name], check=True)
              subprocess.run(['git', 'apply', '--unidiff-zero', patch.name], check=True)
          for folder in ('outputs', 'skills'):
              shutil.rmtree(root / folder)
          (root / '.github/generated-products-source.patch.b64').unlink()
          (root / '.github/workflows/generated-products-work.yml').unlink()
          PY
          python -m examples.catalog
          python -m build.ebnf
          python -m build.definitions
          python -m build.authoring
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('generated')
          manifest = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in sorted(root.rglob('*')) if p.is_file() and '__pycache__' not in p.parts}
          pathlib.Path('docs/plans/0014-generated-products/evidence/generated-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
          git add -A
          test "$(git write-tree)" = b60c5a4bff68f7fba5c7141145962e9b4e23c291
      - name: Verify candidate and repeat generation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q oak build examples generated/oak-authoring.skill/scripts
          python -m build.examples
          python build/examples.py
          python docs/plans/0014-generated-products/evidence/audit.py
          python -m examples.catalog
          python -m build.ebnf
          python -m build.definitions
          python -m build.authoring
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git write-tree)" = b60c5a4bff68f7fba5c7141145962e9b4e23c291
      - name: Preserve history and publish verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(generated)!: consolidate generated products' -m 'Generate construct definitions as .oak.md files and deliver oak-authoring.skill beside the assembled agent. Move the maintained validator out of generated delivery and preserve its exact bytes. Replace old output paths without aliases; install bundle contents as oak-authoring for strict Agent Skills hosts. The candidate tree matches the locally verified snapshot and passes both full checks, the frozen-baseline audit, and repeat generation.'
          git fetch origin docs/plan-generated-products
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:refs/heads/docs/plan-generated-products
          echo "Delivered commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified tree: $(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
