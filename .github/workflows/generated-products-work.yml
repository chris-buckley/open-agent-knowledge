name: Generated product migration workspace
on:
  push:
    branches: [docs/plan-generated-products]
    paths:
      - .github/workflows/generated-products-work.yml
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export tracked workspace
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/oak-workspace.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/oak-workspace-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: oak-workspace
          path: |
            ${{ runner.temp }}/oak-workspace.zip
            ${{ runner.temp }}/oak-workspace-commit.txt
          retention-days: 1
