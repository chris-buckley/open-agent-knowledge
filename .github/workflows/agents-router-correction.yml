name: AGENTS router correction

on:
  push:
    branches:
      - docs/architecture-manual

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  correct:
    if: "${{ startsWith(github.event.head_commit.message, 'chore(automation): correct documentation router') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/architecture-manual
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Replace README index with AGENTS router
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          def replace_one(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one match in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_one(
              "AGENTS.md",
              "├── README.md                       documentation map and authority\n",
              "",
          )
          replace_one(
              "AGENTS.md",
              "- Read `docs/README.md` when documentation ownership, authority, or paths change.\n",
              "- Use this `AGENTS.md` as the only documentation index and router.\n",
          )
          replace_one(
              "AGENTS.md",
              "- Do not create or reference `.agent`.\n",
              "- Do not create or reference `.agent`.\n- Do not add README files as repository or directory indexes.\n",
          )
          replace_one(
              "AGENTS.md",
              "- Update `docs/README.md` and the documentation router when a documentation path changes.\n",
              "- Update the documentation router when a documentation path changes.\n",
          )

          replace_one(
              "build/checks/documentation.py",
              '    "docs/README.md",\n',
              "",
          )
          replace_one(
              "build/checks/documentation.py",
              '_REMOVED_PRD = Path("docs") / ("PRD" + ".md")\n_OBSOLETE_TEXT = (\n    _REMOVED_PRD.as_posix(),\n',
              '_REMOVED_PRD = Path("docs") / ("PRD" + ".md")\n_REMOVED_INDEXES = (\n    Path("README" + ".md"),\n    Path("docs") / ("README" + ".md"),\n)\n_OBSOLETE_TEXT = (\n    _REMOVED_PRD.as_posix(),\n    _REMOVED_INDEXES[1].as_posix(),\n',
          )
          replace_one(
              "build/checks/documentation.py",
              '    expected_routes = set(ROUTED_DOCUMENTS) - {"docs/README.md"}\n',
              '    expected_routes = set(ROUTED_DOCUMENTS)\n',
          )
          replace_one(
              "build/checks/documentation.py",
              '    agents = (ROOT / "AGENTS.md").read_text(encoding="utf-8")\n    index = (ROOT / "docs" / "README.md").read_text(encoding="utf-8")\n\n',
              '    agents = (ROOT / "AGENTS.md").read_text(encoding="utf-8")\n\n',
          )
          replace_one(
              "build/checks/documentation.py",
              '        if relative.as_posix() not in index:\n            raise RuntimeError(f"docs/README.md router omits {relative}")\n',
              "",
          )
          replace_one(
              "build/checks/documentation.py",
              '    if (ROOT / _REMOVED_PRD).exists():\n        raise RuntimeError(f"{_REMOVED_PRD} remains after architecture migration")\n\n',
              '    if (ROOT / _REMOVED_PRD).exists():\n        raise RuntimeError(f"{_REMOVED_PRD} remains after architecture migration")\n\n    for index_path in _REMOVED_INDEXES:\n        if (ROOT / index_path).exists():\n            raise RuntimeError(f"README index is forbidden: {index_path}")\n\n',
          )

          replace_one(
              "docs/architecture/repository.md",
              "│   ├── README.md\n",
              "",
          )
          replace_one(
              "docs/architecture/repository.md",
              "No generated output defines source behaviour. No completed plan defines current architecture.\n",
              "The root `AGENTS.md` is the only documentation index and router.\n\nNo generated output defines source behaviour. No completed plan defines current architecture.\n",
          )

          replace_one(
              "docs/plans/0002-plan.md",
              "├── README.md\n",
              "",
          )
          replace_one(
              "docs/plans/0002-plan.md",
              "- [x] Make `docs/README.md` the human documentation index.\n",
              "- [x] Make root `AGENTS.md` the only documentation index and router.\n",
          )
          replace_one(
              "docs/plans/0002-plan.md",
              "- [x] Verify every routed path appears in `docs/README.md`.\n",
              "- [x] Verify no repository or docs README index exists.\n",
          )
          replace_one(
              "docs/plans/0002-plan.md",
              "- [x] `AGENTS.md` routes every task to the correct current documents.\n",
              "- [x] `AGENTS.md` is the only documentation index and routes every task to the correct current documents.\n",
          )

          replace_one(
              "docs/plans/0002-report.md",
              "├── README.md\n",
              "",
          )
          replace_one(
              "docs/plans/0002-report.md",
              "`AGENTS.md` now requires the architecture overview before implementation files and routes each task to every matching document.\n",
              "`AGENTS.md` now requires the architecture overview before implementation files and routes each task to every matching document.\n\nIt is the only documentation index. No repository or docs README index is used.\n",
          )
          replace_one(
              "docs/plans/0002-report.md",
              "- documentation path, router, and local link freshness;\n",
              "- documentation path, AGENTS router, and local link freshness;\n- absence of repository and docs README indexes;\n",
          )
          replace_one(
              "docs/plans/0002-report.md",
              "The temporary workspace workflow is removed.\n",
              f"GitHub Actions run `{os.environ['GITHUB_RUN_ID']}` validated the AGENTS-only router correction and the full build.\n\nThe temporary workspace workflow is removed.\n",
          )
          PY
          git rm docs/README.md
      - name: Install declared dependencies
        run: |
          python -m pip install \
            'pydantic[email,timezone]>=2.13,<3' \
            'pydantic-extra-types[all]>=2.11' \
            'pydantic-settings>=2.15' \
            'PyYAML>=6,<7'
      - name: Verify complete repository
        run: |
          python -m compileall -q oak build examples
          python -m build.examples
          python build/examples.py
          git diff --check
      - name: Commit correction
        run: |
          git config user.name OpenAI
          git config user.email openai@example.invalid
          git add -A
          git commit -m 'docs(architecture): use AGENTS as sole router'
          git push origin HEAD:docs/architecture-manual
