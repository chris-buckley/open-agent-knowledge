name: Example implementation workspace
on:
  push:
    branches: [plan/self-contained-examples]
    paths: [.github/workflows/example-workspace.yml]
permissions:
  contents: write
jobs:
  implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact tested source patch
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'.github/oak-workspace/patch.{i}').read_text() for i in range(6))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'bfcd0259d8ed7cd1eb3aef721d796efaaec94394be062d8c47a96d7d14d5d069'
          pathlib.Path('/tmp/oak-source.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '/tmp/oak-source.patch'], check=True)
          baseline = json.loads(pathlib.Path('docs/plans/0008-self-contained-examples/evidence/baseline.json').read_text())
          for source in baseline['path_map']:
              if source.endswith('.oak.md'):
                  path = pathlib.Path(source)
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == baseline['snapshots'][source]
                  subprocess.run(['git', 'rm', '--', source], check=True)
          PY
      - name: Install declared dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib
          dependencies = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']
          subprocess.run([sys.executable, '-m', 'pip', 'install', *dependencies], check=True)
          PY
      - name: Generate and verify exact candidate
        run: |
          python -m compileall -q oak build examples skills/oak-authoring/scripts
          python -m examples.catalog
          python -m build.ebnf
          python -m build.docs
          python -m build.authoring
          python - <<'PY'
          import hashlib, pathlib
          roots = ['oak', 'build', 'examples', 'skills', 'outputs']
          files = [p for root in roots for p in pathlib.Path(root).rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc']
          files.append(pathlib.Path('pyproject.toml'))
          encoded = ''.join(str(p) + '\0' + hashlib.sha256(p.read_bytes()).hexdigest() + '\n' for p in sorted(files))
          digest = hashlib.sha256(encoded.encode()).hexdigest()
          print('Candidate product SHA256:', digest)
          assert digest == '3476d694910ea0dc0f7fa855105ba5d102351f2aaafbf342f01317c42d167f4c'
          PY
          git add build examples skills outputs docs
          git diff --cached --check
          python -m build.examples
          python build/examples.py
          python -m examples.catalog
          python -m build.ebnf
          python -m build.docs
          python -m build.authoring
          git diff --exit-code
      - name: Verify approved detached bootstrap and cache reuse
        run: python -m build.checks.bootstrap_integration --allow-download
      - name: Commit implementation on authorized branch
        run: |
          test "$GITHUB_REF" = refs/heads/plan/self-contained-examples
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(examples): deliver self-contained scenarios and shared skill teaching'
          git push origin HEAD:refs/heads/plan/self-contained-examples
          mkdir -p /tmp/oak-result
          git archive --format=zip --output=/tmp/oak-result/repository.zip HEAD
          git rev-parse HEAD > /tmp/oak-result/revision.txt
          python -m pip freeze > /tmp/oak-result/dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: oak-verified-implementation
          path: /tmp/oak-result/
          retention-days: 3
