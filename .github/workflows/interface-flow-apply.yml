name: Interface flow import cleanup

on:
  push:
    branches:
      - docs/interface-flow-plan

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ startsWith(github.event.head_commit.message, 'chore(automation): delete interface flow import branch') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/interface-flow-plan
          fetch-depth: 0
      - name: Delete temporary import branch
        run: git push origin --delete automation/interface-flow-import
