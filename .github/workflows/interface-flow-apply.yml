name: Interface flow patch applier

on:
  push:
    branches:
      - docs/interface-flow-plan

permissions:
  contents: write

jobs:
  apply:
    if: "${{ startsWith(github.event.head_commit.message, 'chore(automation): stage interface flow') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/interface-flow-plan
          fetch-depth: 0
      - name: Apply staged commits
        run: |
          cat .github/interface-flow/series.patch.* > /tmp/interface-flow.patch
          git config user.name OpenAI
          git config user.email openai@example.invalid
          git am /tmp/interface-flow.patch
          git rm .github/interface-flow/series.patch.*
          git commit --amend --no-edit
          git push origin HEAD:docs/interface-flow-plan
