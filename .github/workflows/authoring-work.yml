name: Publish and verify portable authoring
on:
  push:
    branches: [feat/portable-oak-authoring]
    paths: [.github/workflows/authoring-work.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portable-oak-authoring
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply verified implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip, hashlib, shutil, subprocess
          payload = Path('.agents/oak-authoring-delivery')
          patch = gzip.decompress(b''.join(p.read_bytes() for p in sorted(payload.glob('*.part'))))
          expected = 'cbede1306c656594fe90f8fb7e6b00cdbe60461226f96cabdb6c9228680e3291'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise RuntimeError('Implementation transfer checksum mismatch')
          subprocess.run(['git', 'apply', '--exclude=.github/workflows/verify.yml'], input=patch, check=True)
          shutil.rmtree(payload)
          PY
      - name: Install repository dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib
          dependencies = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']
          subprocess.run([sys.executable, '-m', 'pip', 'install', *dependencies], check=True)
          PY
      - name: Generate and verify all products
        run: |
          python -m compileall -q oak build examples skills/oak-authoring/scripts
          python -m build.ebnf
          python -m build.docs
          python -m build.authoring
          python -m build.examples
          python build/examples.py
          git add -A
          python -m build.ebnf
          python -m build.docs
          python -m build.authoring
          git diff --exit-code
          git diff --cached --check
      - name: Verify actual approved download and retained installation
        run: python -m build.checks.bootstrap_integration --allow-download
      - name: Publish verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(oak): deliver portable authoring skill and fused agent'
          git push origin HEAD:feat/portable-oak-authoring
          git rev-parse HEAD
          git archive --format=zip HEAD -o /tmp/oak-authoring-verified.zip
      - uses: actions/upload-artifact@v4
        with:
          name: oak-authoring-verified
          path: /tmp/oak-authoring-verified.zip
          retention-days: 3
