name: Authoring work snapshot
on:
  push:
    branches: [feat/portable-oak-authoring]
    paths: [.github/workflows/authoring-work.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o /tmp/oak-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: oak-source
          path: /tmp/oak-source.zip
          retention-days: 1
