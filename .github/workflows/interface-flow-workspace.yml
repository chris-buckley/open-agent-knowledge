name: Interface flow validation

on:
  push:
    branches:
      - docs/interface-flow-plan

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  verify:
    if: startsWith(github.event.head_commit.message, 'chore(automation): validate interface flow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/interface-flow-plan
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared dependencies
        run: |
          python -m pip install \
            'pydantic[email,timezone]>=2.13,<3' \
            'pydantic-extra-types[all]>=2.11' \
            'pydantic-settings>=2.15' \
            'PyYAML>=6,<7'
      - name: Verify product
        run: python -m build.examples
      - name: Verify direct command
        run: python build/examples.py
      - name: Check obsolete current syntax
        run: |
          if rg -n 'InterfaceValue|direction="(in|out|inout)"|direction=("|\x27)(in|out|inout)|\$interface\.|Arrival\([^)]*source=|interfaces=' oak build examples outputs; then
            exit 1
          fi
      - name: Check worktree
        run: git diff --exit-code
