name: Interface flow validation

on:
  push:
    branches:
      - docs/interface-flow-plan

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  verify:
    if: "${{ startsWith(github.event.head_commit.message, 'chore(automation): validate interface flow') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/interface-flow-plan
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared dependencies
        run: |
          python -m pip install \
            'pydantic[email,timezone]>=2.13,<3' \
            'pydantic-extra-types[all]>=2.11' \
            'pydantic-settings>=2.15' \
            'PyYAML>=6,<7'
      - name: Compile sources
        run: python -m compileall -q oak build examples
      - name: Regenerate committed products
        run: |
          python build/authoring.py
          python build/ebnf.py
          python build/docs.py
      - name: Verify product as module
        run: python -m build.examples
      - name: Verify direct command
        run: python build/examples.py
      - name: Check generated worktree
        run: git diff --exit-code
