name: Python conventions source snapshot
on:
  push:
    branches: [improve/python-code-conventions]
    paths: [.github/workflows/python-conventions-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 21c2dc5b9366068875709e1cefab3a942f51836c
      - name: Archive the unchanged baseline
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: python-conventions-baseline
          path: source.zip
          retention-days: 1
