[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "json-ld-agent-skill"
version = "1.0.0"
description = "Executable support files for the json-ld agent skill"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Christopher Buckley"}]
dependencies = [
  "PyLD==3.1.0",
  "pydantic==2.13.4",
  "jsonschema[format]==4.26.0",
  "rdflib==7.6.0"
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
